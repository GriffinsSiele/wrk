# Railway: set Root Directory to `backend` for this service.
# Dashboard → New Project → GitHub repo → Root Directory = backend

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
# Run migrations before each deploy traffic switch
releaseCommand = "alembic upgrade head"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 30
