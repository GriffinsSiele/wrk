# Production-style local stack (mirrors Azure Container Apps layout).
# Usage:
#   cp .env.example .env.prod   # fill secrets — never commit .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Do NOT run seed.py against production data.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-olynixx}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-olynixx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do not publish 5432 to the host in real production; Azure Flexible Server is private.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olynixx}
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
      BUNNY_API_KEY: ${BUNNY_API_KEY:-}
      BUNNY_CDN_HOSTNAME: ${BUNNY_CDN_HOSTNAME:-}
      BUNNY_TOKEN_AUTH_KEY: ${BUNNY_TOKEN_AUTH_KEY:-}
      EXAM_PASS_MARK: ${EXAM_PASS_MARK:-70}
      EXAM_TIME_LIMIT_MINUTES: ${EXAM_TIME_LIMIT_MINUTES:-60}
      EXAM_MAX_ATTEMPTS: ${EXAM_MAX_ATTEMPTS:-3}
      EXAM_SUBMIT_GRACE_MINUTES: ${EXAM_SUBMIT_GRACE_MINUTES:-2}
      EXAM_DELIVERY_MODE: ${EXAM_DELIVERY_MODE:-online}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      CERTIFICATE_STORAGE_DIR: /app/storage/certificates
    volumes:
      - cert_storage:/app/storage/certificates
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olynixx}
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_prod_data:
  cert_storage:
